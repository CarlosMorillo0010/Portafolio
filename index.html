<html lang="es">

    <title>carlos@portfolio — full stack developer</title>
    <meta
      name="description"
      content="Portafolio de Carlos Puerta, desarrollador full stack e ingeniero de software. Laravel, Node.js, WordPress a medida y React."
    />
    <meta name="theme-color" content="#0c0d0c" />

    />
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo inicial.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
